            \ and concise;\nUse standard immunology/genomics terms (e.g., CD8+ T cells,\
            \ HLA, scRNA-seq);\nPrioritize clarity, logic, and result-driven narrative;\n\
            Avoid emotional or promotional language;\nMention “Figure X” placeholders\
            \ where applicable for visual elements.\n\n"
